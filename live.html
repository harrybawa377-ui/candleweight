    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --live-red: #ef4444;
            --live-green: #22c55e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. TOP NAV */
        .top-nav {
            background-color: #0b1120;
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
            height: 50px;
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .top-nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .top-nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-nav-links a:hover,
        .top-nav-links a.active {
            color: var(--accent-color);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-red);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--live-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* 2. BRAND HEADER */
        .brand-header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
        }

        .brand-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
            flex-shrink: 0;
        }

        .brand-title h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-title p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* 3. MAIN BODY */
        .main-content {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            min-width: 0;
        }

        .content-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            width: 100%;
            min-width: 0;
        }

        .live-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* FLOATING ACTION BUTTONS CONTAINER */
        .floating-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .floating-btn {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            background-color: #0b1120;
            border: 1.5px solid var(--accent-color);
            padding: 10px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }

        .floating-btn:hover {
            background-color: var(--accent-color);
            color: #0b1120;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        /* BACK TO TOP BUTTON (HIDDEN BY DEFAULT) */
        #back-to-top-btn {
            display: none;
            padding: 10px 14px;
        }

        .btn-icon {
            font-size: 1rem;
            display: inline-block;
        }

        /* SCROLLABLE TABLE CONTAINER */
        .table-wrapper {
            width: 100%;
            max-width: 100%;
            max-height: 500vh; /* Dynamically caps height for phone screens */
            overflow-x: auto;
            overflow-y: auto;
            display: block;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* CUSTOM SCROLLBAR STYLING */
        .table-wrapper::-webkit-scrollbar {
            height: 8px; /* Fixed high height bug on mobile */
            width: 8px;
        }
        
        .table-wrapper::-webkit-scrollbar-track {
            background: #0b1120;
            border-radius: 8px;
        }
        
        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }
        
        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #0b1120;
            color: var(--accent-color);
            padding: 12px 14px;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            
            /* STICKY TABLE HEADER AT THE TOP */
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* 4. FOOTER */
        .site-footer {
            background-color: #0b1120;
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            margin-top: auto;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-info {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer-links {
            list-style: none;
            display: flex;
            gap: 1.2rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        /* 5. MOBILE RESPONSIVE MEDIA QUERIES */
        @media screen and (max-width: 600px) {
            .top-nav {
                padding: 0 1rem;
            }

            .brand-header {
                padding: 1rem;
            }

            .brand-title h1 {
                font-size: 1.15rem;
            }

            .brand-title p {
                font-size: 0.75rem;
            }

            .main-content {
                margin: 0.8rem auto;
                padding: 0 0.5rem;
            }

            .content-card {
                padding: 0.75rem;
            }

            th, td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }

            .floating-controls {
                bottom: 15px;
                right: 15px;
                flex-direction: column;
                align-items: flex-end;
            }

            .floating-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }

            #back-to-top-btn {
                padding: 8px 10px;
            }

            .footer-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }

            .footer-links {
                gap: 1rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <main class="main-content">

        <button id="back-to-top-btn" class="floating-btn" onclick="scrollToTop()">
            <span class="btn-icon">↑</span> Top
        </button>
        <button class="floating-btn" onclick="refreshWholePage()">
            <span class="btn-icon">↻</span> Refresh
        </button>

    <!-- SCRIPT -->
    <script>
        const BLOB_DATA_URL = "https://gist.githubusercontent.com/harrybawa377-ui/54741cb067b06d568c4c8b30a7602f8e/raw/data.json";

        // Real-time listener for table container scrolling
        const wrapper = document.getElementById("table-wrapper");
        if (wrapper) {
            wrapper.addEventListener("scroll", () => {
                sessionStorage.setItem("tableScrollX", wrapper.scrollLeft);
                sessionStorage.setItem("tableScrollY", wrapper.scrollTop);
            });
        }

        // Global Window Scroll Listener
        window.addEventListener("scroll", () => {
            sessionStorage.setItem("scrollPositionX", window.scrollX);
            sessionStorage.setItem("scrollPositionY", window.scrollY);

            const topBtn = document.getElementById("back-to-top-btn");
            if (window.scrollY > 300) {
                topBtn.style.display = "flex";
            } else {
                topBtn.style.display = "none";
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        function refreshWholePage() {
            sessionStorage.setItem("scrollPositionX", window.scrollX);
            sessionStorage.setItem("scrollPositionY", window.scrollY);

            if (wrapper) {
                sessionStorage.setItem("tableScrollX", wrapper.scrollLeft);
                sessionStorage.setItem("tableScrollY", wrapper.scrollTop);
            }

            location.reload();
        }

        // Restore window scroll position (if page reloads)
        window.addEventListener("DOMContentLoaded", () => {
            const scrollY = sessionStorage.getItem("scrollPositionY");
            const scrollX = sessionStorage.getItem("scrollPositionX");
            if (scrollY !== null || scrollX !== null) {
                window.scrollTo(scrollX ? parseInt(scrollX, 10) : 0, scrollY ? parseInt(scrollY, 10) : 0);
            }
        });

        function renderTable(data) {
            const tableHead = document.getElementById("table-head");
            const tableBody = document.getElementById("table-body");
            const wrapper = document.getElementById("table-wrapper");

            if (!data || data.length === 0) {
                tableHead.innerHTML = "<tr><th>No data available</th></tr>";
                tableBody.innerHTML = "";
                return;
            }

            // 1. Capture exact scroll positions before modifying the DOM
            const currentTableTop = wrapper ? wrapper.scrollTop : 0;
            const currentTableLeft = wrapper ? wrapper.scrollLeft : 0;

            const storedTableY = sessionStorage.getItem("tableScrollY");
            const storedTableX = sessionStorage.getItem("tableScrollX");

            const finalY = storedTableY !== null ? parseInt(storedTableY, 10) : currentTableTop;
            const finalX = storedTableX !== null ? parseInt(storedTableX, 10) : currentTableLeft;

            // 2. Build headers dynamically
            const headers = Array.from(
                new Set(data.flatMap(row => Object.keys(row)))
            );

            // 3. Update DOM
            tableHead.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

            tableBody.innerHTML = data.map(row => {
                return "<tr>" + headers.map(h => {
                    const cellVal = row[h] !== undefined && row[h] !== null ? row[h] : "";
                    return `<td>${cellVal}</td>`;
                }).join("") + "</tr>";
            }).join("");

            // 4. Force browser to restore scroll position immediately on render frame
            if (wrapper) {
                requestAnimationFrame(() => {
                    wrapper.scrollTop = finalY;
                    wrapper.scrollLeft = finalX;
                });
            }
        }

        async function loadData() {
            try {
                const response = await fetch(`${BLOB_DATA_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        // Initial Load and Polling Loop (30 Seconds)
        loadData();
        setInterval(loadData, 30000);
    </script>
